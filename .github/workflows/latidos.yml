name: Latidos

# Latido de las colas de Yard, Live, el CRM y Publisher (Plesk duerme las apps; cada latido las
# despierta y procesa lo vencido). Reemplaza a cron-job.org, que no llega a estos sitios (nov-2026).
#
# CONTINUO (desde 2026-11-24): la programación de GitHub (`schedule`) es "lo mejor posible" y en la
# práctica corría una vez cada 4-12 h. Por eso cada ejecución queda latiendo cada 60 s durante
# ~5 h 45 min y al terminar se relanza sola (workflow_dispatch). El `schedule` queda solo como
# respaldo: si la cadena se corta, la vuelve a arrancar la próxima vez que GitHub lo ejecute.
# `concurrency` impide que corran dos a la vez (las que lleguen mientras tanto quedan en espera
# o se cancelan: es normal ver algunas "cancelled").
#
# Los tokens van como secrets del repo; aquí solo están las URLs públicas.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write # relanzarse y mantener viva la programación

concurrency:
  group: latidos
  cancel-in-progress: false

jobs:
  latir:
    runs-on: ubuntu-latest
    # Tope de GitHub: 360 min. El bucle dura 345 para que siempre llegue al paso de relanzar.
    timeout-minutes: 358
    steps:
      - name: Latidos cada 60 s (~5 h 45 min)
        env:
          YARD_CRON_TOKEN: ${{ secrets.YARD_CRON_TOKEN }}
          CRM_CRON_TOKEN: ${{ secrets.CRM_CRON_TOKEN }}
          PUBLISHER_CRON_TOKEN: ${{ secrets.PUBLISHER_CRON_TOKEN }}
        run: |
          latir() { # nombre url [cabecera]
            local code
            if [ -n "$3" ]; then
              code=$(curl -s -o /dev/null -m 40 -w '%{http_code}' -H "$3" "$2" || true)
            else
              code=$(curl -s -o /dev/null -m 40 -w '%{http_code}' "$2" || true)
            fi
            echo "$(date -u +%H:%M:%S) $1 $code"
            [ "$code" = "200" ] || echo "::warning::$1 respondió $code"
          }
          fin=$(( $(date +%s) + 345 * 60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            inicio=$(date +%s)
            # En paralelo: un sitio lento no atrasa a los demás.
            if [ -n "$YARD_CRON_TOKEN" ]; then latir yard https://yard.heavylisting.com/api/v1/cron/tick "X-Cron-Token: $YARD_CRON_TOKEN" & fi
            if [ -n "$CRM_CRON_TOKEN" ]; then latir crm https://crm.pruebalucuma.site/api/v1/cron/tick "X-LCRM-Cron: $CRM_CRON_TOKEN" & fi
            if [ -n "$PUBLISHER_CRON_TOKEN" ]; then latir publisher https://publisher.pruebalucuma.site/api/v1/cron/latido "X-Cron: $PUBLISHER_CRON_TOKEN" & fi
            latir live https://live.heavylisting.com/api/health &
            wait
            espera=$(( 60 - ($(date +%s) - inicio) ))
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done

      - name: Relanzar (siguiente tramo de la cadena)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run latidos.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"

      # GitHub apaga la programación de un repo público tras 60 días sin actividad: cada tramo
      # (~6 h) la vuelve a habilitar, lo que reinicia ese plazo.
      - name: Mantener viva la programación
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/latidos.yml/enable" && echo "programación renovada"
